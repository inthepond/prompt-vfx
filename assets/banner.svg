<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="prompt-vfx">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5b1f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="900" cy="160" r="260" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#ff5b1f" stroke-opacity="0.7" stroke-width="2">
    <path d="M40 40 h22 M40 40 v22" fill="none"/>
    <path d="M1160 280 h-22 M1160 280 v-22" fill="none"/>
  </g>

  <!-- title -->
  <text x="80" y="150" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="76" font-weight="700" letter-spacing="-2">
    <tspan fill="#f2f2f2">prompt</tspan><tspan fill="url(#accent)">·vfx</tspan>
  </text>
  <rect x="82" y="172" width="232" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="84" y="214" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22" fill="#8a8a90" letter-spacing="1">
    visual effects, generated from prompts
  </text>

  <!-- tab chips -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="600">
    <g transform="translate(84,250)">
      <rect width="118" height="34" rx="17" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="17" r="5" fill="#4be07a"/>
      <text x="38" y="22" fill="#cfcfd4">VFX · 100</text>
    </g>
    <g transform="translate(214,250)">
      <rect width="116" height="34" rx="17" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="17" r="5" fill="#00d4ff"/>
      <text x="38" y="22" fill="#cfcfd4">GSAP · 40</text>
    </g>
    <g transform="translate(342,250)">
      <rect width="104" height="34" rx="17" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="17" r="5" fill="#ff5b1f"/>
      <text x="38" y="22" fill="#cfcfd4">3D · 22</text>
    </g>
  </g>
</svg>
