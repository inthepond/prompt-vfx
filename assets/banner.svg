<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="prompt-vfx — visual effects generated from prompts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5b1f" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="940" cy="160" r="250" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#ff5b1f" stroke-opacity="0.7" stroke-width="2" fill="none">
    <path d="M40 40 h22 M40 40 v22"/>
    <path d="M1160 280 h-22 M1160 280 v-22"/>
  </g>

  <!-- title: width pinned so it never depends on the renderer's font -->
  <text x="80" y="158" textLength="520" lengthAdjust="spacingAndGlyphs"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="72" font-weight="700">
    <tspan fill="#f2f2f2">prompt</tspan><tspan fill="url(#accent)">·vfx</tspan>
  </text>
  <rect x="82" y="178" width="520" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="83" y="220" textLength="470" lengthAdjust="spacingAndGlyphs"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="21" fill="#8a8a90">
    visual effects, generated from prompts
  </text>

  <!-- tab chips: pill width fixed, label width pinned smaller than the pill -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <g transform="translate(83,250)">
      <rect width="146" height="34" rx="17" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="17" r="5" fill="#4be07a"/>
      <text x="40" y="22" textLength="92" lengthAdjust="spacingAndGlyphs" fill="#cfcfd4">VFX · 100</text>
    </g>
    <g transform="translate(241,250)">
      <rect width="146" height="34" rx="17" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="17" r="5" fill="#00d4ff"/>
      <text x="40" y="22" textLength="92" lengthAdjust="spacingAndGlyphs" fill="#cfcfd4">GSAP · 40</text>
    </g>
    <g transform="translate(399,250)">
      <rect width="128" height="34" rx="17" fill="#141416" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="22" cy="17" r="5" fill="#ff5b1f"/>
      <text x="40" y="22" textLength="74" lengthAdjust="spacingAndGlyphs" fill="#cfcfd4">3D · 22</text>
    </g>
  </g>
</svg>
